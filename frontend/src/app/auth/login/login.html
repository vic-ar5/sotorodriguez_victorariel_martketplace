<section class="pantalla-auth">
  <div class="tarjeta-auth">
    <div class="logotipo">
      <app-logotipo />
    </div>

    <h2 class="titulo-auth">Iniciar sesión</h2>

    @if (cuentaCreada) {
      <p class="mensaje-ok" role="status">
        Cuenta creada correctamente. Ahora inicia sesión.
      </p>
    }

    <form [formGroup]="formulario" (ngSubmit)="enviar()" novalidate>
      <div
        class="campo"
        [class.invalido]="
          formulario.controls.correo.touched && formulario.controls.correo.invalid
        "
      >
        <label for="correo">Correo electrónico</label>
        <input
          id="correo"
          type="email"
          formControlName="correo"
          autocomplete="email"
          placeholder="tucorreo@ejemplo.com"
          (beforeinput)="bloquearCaracteres('correo', permitidosCorreo, $event)"
        />
        @if (mensajeError('correo')) {
          <span class="error">{{ mensajeError('correo') }}</span>
        }
      </div>

      <div
        class="campo"
        [class.invalido]="
          formulario.controls.contrasena.touched &&
          formulario.controls.contrasena.invalid
        "
      >
        <label for="contrasena">Contraseña</label>
        <div class="campo-contrasena">
          <input
            id="contrasena"
            [type]="mostrarContrasena ? 'text' : 'password'"
            formControlName="contrasena"
            autocomplete="current-password"
            placeholder="Tu contraseña"
            (beforeinput)="bloquearCaracteres('contrasena', permitidosPassword, $event)"
          />
          <button
            type="button"
            class="btn-ojo"
            (click)="alternarContrasena()"
            [attr.aria-label]="mostrarContrasena ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            @if (mostrarContrasena) {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path><circle cx="12" cy="12" r="3"></circle></svg>
            } @else {
              <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path><path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path><line x1="1" y1="1" x2="23" y2="23"></line></svg>
            }
          </button>
        </div>
        @if (mensajeError('contrasena')) {
          <span class="error">{{ mensajeError('contrasena') }}</span>
        }
      </div>

      @if (error) {
        <p class="error" role="alert">{{ error }}</p>
      }

      <button
        type="submit"
        class="btn btn-aceptar btn-auth"
        [disabled]="cargando"
      >
        {{ cargando ? 'Iniciando sesión…' : 'Iniciar sesión' }}
      </button>
    </form>

    <p class="barra-auth">
      ¿No tienes cuenta?
      <a class="enlace-claro" routerLink="/registro">Regístrate</a>
    </p>
  </div>
</section>
